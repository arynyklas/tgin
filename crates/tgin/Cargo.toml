[package]
name = "tgin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Routing layer between the Telegram Bot API and downstream bot instances"
license = "MIT AND BSL-1.0"
repository.workspace = true
publish.workspace = true

# `publish = false` makes dist skip the package unless it is opted in.
[package.metadata.dist]
dist = true

[dependencies]
arc-swap.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http-body.workspace = true
parking_lot.workspace = true
qrcode.workspace = true
rand.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tgin-botapi.workspace = true
tgin-core.workspace = true
tgin-mtproto.workspace = true
tgin-runtime.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
base64.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
# Scripted Telegram replies for the login tests.
tgin-mtproto = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
