[package]
name = "tgin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Routing layer between the Telegram Bot API and downstream bot instances"
license.workspace = true
repository.workspace = true
publish.workspace = true

# `publish = false` makes dist skip the package unless it is opted in.
[package.metadata.dist]
dist = true

[dependencies]
arc-swap.workspace = true
axum.workspace = true
clap.workspace = true
http-body.workspace = true
parking_lot.workspace = true
# Only for reading 0.2 configs (`migrate`).
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
tgin-botapi.workspace = true
tgin-core.workspace = true
tgin-runtime.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
futures-util.workspace = true
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util", "time"] }
wiremock.workspace = true

[lints]
workspace = true
