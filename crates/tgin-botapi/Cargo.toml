[package]
name = "tgin-botapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Telegram Bot API client and update facts extraction for tgin."
license.workspace = true
repository.workspace = true
publish.workspace = true

# The benches are criterion and gungraun harnesses; libtest has none to run,
# and it would reject criterion's options (`cargo bench -- --quick`).
[lib]
bench = false

[dependencies]
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
ipnet.workspace = true
multer.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tgin-core.workspace = true
tgin-runtime.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
prometheus-client.workspace = true
proptest.workspace = true
smallvec.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
wiremock.workspace = true

# Callgrind runs on Linux only; elsewhere `hot_path_ir` builds as an empty main.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun.workspace = true

[[bench]]
name = "hot_path"
harness = false

# Needs Valgrind and gungraun-runner, so `cargo bench` skips it unless named:
# `cargo bench -p tgin-botapi --bench hot_path_ir`.
[[bench]]
name = "hot_path_ir"
harness = false
bench = false

[lints]
workspace = true
