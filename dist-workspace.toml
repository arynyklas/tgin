[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Publish GitHub artifact attestations (SLSA build provenance) for release artifacts
github-attestations = true
# Embed the dependency tree in binaries with cargo-auditable
cargo-auditable = true
# Generate a CycloneDX SBOM with cargo-cyclonedx
cargo-cyclonedx = true
# .github/workflows/release.yml carries hand edits that dist cannot express;
# the header of release.yml lists them. To regenerate after a config change or
# a dist upgrade:
# 1. copy the action SHAs currently pinned in release.yml (Dependabot updates
#    them there) into [dist.github-action-commits] below;
# 2. drop this line and run `dist generate`;
# 3. re-apply every hand edit listed in the release.yml header;
# 4. restore this line.
allow-dirty = ["ci"]

# Build arm64 Windows natively. dist's default cross-compiles it with
# cargo-xwin in a container, which is a different toolchain from every other
# target (the aws-lc-sys C build in particular).
# dist 0.32.0 builds aarch64-apple-darwin on macos-14, which GitHub retires on
# 2026-11-02.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
aarch64-pc-windows-msvc = "windows-11-arm"

# Pin the actions used by the generated release workflow to commits.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
