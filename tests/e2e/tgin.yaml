# tgin for the end-to-end suite (`cargo xtask e2e`, tests/e2e/compose.yaml).
#
# Eight bots, one per framework and mode, each long-polling the fake Telegram
# into its own consumer:
# - `<framework>-poll` → a pull consumer the framework polls through the
#   gateway's scoped getUpdates;
# - `<framework>-hook` → a push consumer. aiogram, python-telegram-bot and
#   grammY register their endpoint with setWebhook on the scoped base
#   (`accept_set_webhook`, no configured endpoint); Telegraf's endpoint is
#   configured here, so both paths stay covered.
# Two more on `fake-local`, a self-hosted server in local mode whose files
# directory tgin mounts read-only at the same path:
# - `local-poll` → long-polled into a pull consumer (python-telegram-bot);
# - `local-hook` → tgin registers its own data-plane URL over plain http
#   and the server posts the updates there; a push consumer (grammY,
#   `accept_set_webhook`).
# Tokens and secrets are fake values from compose.yaml.
version: 1

log:
  level: info

reload:
  watch: false

admin:
  # Published on the host's loopback only (compose.yaml); a non-loopback
  # listen needs a token.
  listen: ["0.0.0.0:9090"]
  token: ${env:ADMIN_TOKEN}
  public_metrics: true

server:
  listen: ["0.0.0.0:8080"]

upstreams:
  fake-local:
    kind: local
    url: http://fake-local:8081
    local_mode: true
    # The fake's --files-dir, mounted read-only at the same path
    # (compose.yaml): tgin serves the bots' files from disk.
    files:
      dir: /srv/tba

bots:
  - name: aiogram-poll
    token: ${env:AIOGRAM_POLL_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [aiogram-poll] }]
  - name: aiogram-hook
    token: ${env:AIOGRAM_HOOK_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [aiogram-hook] }]
  - name: ptb-poll
    token: ${env:PTB_POLL_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [ptb-poll] }]
  - name: ptb-hook
    token: ${env:PTB_HOOK_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [ptb-hook] }]
  - name: grammy-poll
    token: ${env:GRAMMY_POLL_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [grammy-poll] }]
  - name: grammy-hook
    token: ${env:GRAMMY_HOOK_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [grammy-hook] }]
  - name: telegraf-poll
    token: ${env:TELEGRAF_POLL_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [telegraf-poll] }]
  - name: telegraf-hook
    token: ${env:TELEGRAF_HOOK_TOKEN}
    api_url: http://fake:8081
    ingress: { long_poll: {} }
    routes: [{ to: [telegraf-hook] }]
  - name: local-poll
    token: ${env:LOCAL_POLL_TOKEN}
    upstream: fake-local
    ingress: { long_poll: {} }
    routes: [{ to: [local-poll] }]
  - name: local-hook
    token: ${env:LOCAL_HOOK_TOKEN}
    upstream: fake-local
    ingress:
      webhook:
        # Served at /webhook/local-hook; the secret is derived from the token.
        public_url: http://tgin:8080
        register: true
    routes: [{ to: [local-hook] }]

consumers:
  aiogram-poll: { pull: {} }
  ptb-poll: { pull: {} }
  grammy-poll: { pull: {} }
  telegraf-poll: { pull: {} }
  aiogram-hook: { push: { accept_set_webhook: true } }
  ptb-hook: { push: { accept_set_webhook: true } }
  grammy-hook: { push: { accept_set_webhook: true } }
  telegraf-hook:
    push:
      endpoints:
        - url: http://telegraf-hook:8081/hook
          secret_token: ${env:TELEGRAF_HOOK_SECRET}
  local-poll: { pull: {} }
  local-hook: { push: { accept_set_webhook: true } }
