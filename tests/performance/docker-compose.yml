name: tgin-bench

# The makefile sets the TGIN_* and PULL_URL_* variables per engine and
# scenario; the defaults here are the v1 webhook scenario.

x-bot: &bot
  image: tgin-bench-bot:local
  build: ./bot
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1)"]
    interval: 2s
    timeout: 1s
    retries: 30

services:
  # The engine under test: tgin 1.x (ENGINE=v1, YAML config, data plane
  # 8080, admin plane 9090) or the original upstream tgin (ENGINE=upstream).
  tgin:
    image: ${TGIN_IMAGE:-tgin-bench:v1}
    pull_policy: never
    environment:
      TGIN_CONFIG: ${TGIN_CONFIG_TARGET:-/etc/tgin/tgin.yaml}
    volumes:
      - ${TGIN_CONFIG_FILE:-./cfgs/v1/webhook-1.yaml}:${TGIN_CONFIG_TARGET:-/etc/tgin/tgin.yaml}:ro
    ports:
      # Readiness probe (v1 admin plane) or management API (upstream) for the host.
      - "${TGIN_PROBE_PORT:-9090}:${TGIN_PROBE_PORT:-9090}"
    depends_on:
      bench:
        condition: service_healthy
    networks:
      testing_net:
        ipv4_address: 10.5.0.2

  # Load generator and fake Telegram Bot API. The fake API is up for the
  # container's life; `tgin-bench run` (through `docker compose exec`) asks
  # it for one measured run.
  bench:
    image: tgin-bench-load:local
    build: ./benchmark
    healthcheck:
      test: ["CMD", "tgin-bench", "health"]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      testing_net:
        ipv4_address: 10.5.0.3

  webhook_bot1:
    <<: *bot
    environment: &webhook-env
      TELEGRAM_API_URL: http://10.5.0.3:8090
      WEBHOOK_PATH: /webhook
      PORT: "8080"
      BOT_SLEEP_MS: ${BOT_SLEEP_MS:-0}
    depends_on: &needs-bench
      bench:
        condition: service_healthy
    networks:
      testing_net:
        ipv4_address: 10.5.0.11

  webhook_bot2:
    <<: *bot
    environment: *webhook-env
    depends_on: *needs-bench
    networks:
      testing_net:
        ipv4_address: 10.5.0.12

  webhook_bot3:
    <<: *bot
    environment: *webhook-env
    depends_on: *needs-bench
    networks:
      testing_net:
        ipv4_address: 10.5.0.13

  # Polls the fake Bot API directly: the long-poll baseline without tgin.
  longpull_bot_direct:
    <<: *bot
    command: ["python", "longpull.py"]
    environment:
      TELEGRAM_API_URL: http://10.5.0.3:8090
      TGIN_ENDPOINT: http://10.5.0.3:8090/bot123:test/getUpdates
      PORT: "8080"
      BOT_SLEEP_MS: ${BOT_SLEEP_MS:-0}
    depends_on: *needs-bench
    networks:
      testing_net:
        ipv4_address: 10.5.0.20

  longpull_bot1:
    <<: *bot
    command: ["python", "longpull.py"]
    environment:
      TELEGRAM_API_URL: http://10.5.0.3:8090
      TGIN_ENDPOINT: ${PULL_URL_1:-http://10.5.0.2:8080/c/bots/getUpdates}
      PORT: "8080"
      BOT_SLEEP_MS: ${BOT_SLEEP_MS:-0}
    depends_on: &needs-tgin
      tgin:
        condition: service_started
    networks:
      testing_net:
        ipv4_address: 10.5.0.21

  longpull_bot2:
    <<: *bot
    command: ["python", "longpull.py"]
    environment:
      TELEGRAM_API_URL: http://10.5.0.3:8090
      TGIN_ENDPOINT: ${PULL_URL_2:-http://10.5.0.2:8080/c/bots/getUpdates}
      PORT: "8080"
      BOT_SLEEP_MS: ${BOT_SLEEP_MS:-0}
    depends_on: *needs-tgin
    networks:
      testing_net:
        ipv4_address: 10.5.0.22

  longpull_bot3:
    <<: *bot
    command: ["python", "longpull.py"]
    environment:
      TELEGRAM_API_URL: http://10.5.0.3:8090
      TGIN_ENDPOINT: ${PULL_URL_3:-http://10.5.0.2:8080/c/bots/getUpdates}
      PORT: "8080"
      BOT_SLEEP_MS: ${BOT_SLEEP_MS:-0}
    depends_on: *needs-tgin
    networks:
      testing_net:
        ipv4_address: 10.5.0.23

networks:
  testing_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
