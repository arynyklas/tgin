[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The benchmark harness is a separate crate with its own Cargo.lock.
exclude = ["tests/performance/benchmark"]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/arynyklas/tgin"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' builds release archives with; it keeps the release
# profile's fat LTO and single codegen unit.
[profile.dist]
inherits = "release"

[workspace.dependencies]
aho-corasick = "1.1.5"
parking_lot = "0.12.5"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rand = "0.10.3"
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-util = "0.7.20"
