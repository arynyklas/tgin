[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The benchmark harness is a separate crate with its own Cargo.lock.
exclude = ["tests/performance/benchmark"]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/arynyklas/tgin"
publish = false

[workspace.dependencies]
arc-swap = "1.9.2"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
parking_lot = "0.12.5"
prometheus-client = "0.25.1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' builds release archives with; it keeps the release
# profile's fat LTO and single codegen unit.
[profile.dist]
inherits = "release"
