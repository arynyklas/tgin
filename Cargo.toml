[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The benchmark harness is a separate crate with its own Cargo.lock.
exclude = ["tests/performance/benchmark"]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/arynyklas/tgin"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' builds release archives with; it keeps the release
# profile's fat LTO and single codegen unit.
[profile.dist]
inherits = "release"
