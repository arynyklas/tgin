# yaml-language-server: $schema=../../../schema/tgin.v1.schema.json
#
# One bot, three downstream instances: two poll tgin (pull), one receives
# webhooks (push). Updates are shared round robin. Every instance uses tgin's
# Bot API gateway as its Bot API: its sends reach Telegram through tgin,
# within the bot's rate limits. From examples/simple, check it with
# `TOKEN=… TGIN_ADMIN_TOKEN=… TELEGRAM_API_URL=https://api.telegram.org
# tgin config validate config/tgin.yaml` (every `${env:…}` must be set).
# docker-compose.yml mounts this directory as /etc/tgin.
version: 1

# The data plane: the gateway, which the bots use as their Bot API.
server:
  listen: ["0.0.0.0:8080"]

# The admin plane (health, status, metrics) stays on its default loopback
# listener, 127.0.0.1:9090, inside the container; compose does not publish
# it. The image's HEALTHCHECK (`tgin admin health`) needs no token; the
# other admin endpoints need TGIN_ADMIN_TOKEN as a bearer token.
admin:
  token: ${env:TGIN_ADMIN_TOKEN}

bots:
  - name: main
    token: ${env:TOKEN}
    # TELEGRAM_API_URL must be set: the config has no default for it.
    # docker-compose.yml sets it (default https://api.telegram.org); set it
    # yourself when you use this file elsewhere, e.g. with `config validate`.
    api_url: ${env:TELEGRAM_API_URL}
    ingress:
      long_poll: {}
    routes:
      - to:
          - split:
              strategy: round_robin
              among: [bot1, bot3, bot2]

consumers:
  # bot1 and bot2 use http://tgin:8080/c/<name> as their Bot API base URL:
  # their getUpdates polls this consumer.
  bot1:
    pull:
      # When a bot is stopped, its queue drops its oldest updates instead of
      # pausing the source for every bot.
      on_full: drop_oldest
  bot2:
    pull:
      # Same as bot1.
      on_full: drop_oldest
  # bot3 receives webhooks.
  bot3:
    push:
      endpoints:
        - url: http://bot3:3001/bot
      # bot3 answers each message with a sendMessage in its response body;
      # tgin makes that call (the default, webhook_reply: execute).
      webhook_reply: execute
      # A full queue drops its oldest updates, so a stopped bot3 never stalls
      # bot1 and bot2. bot3 starts after tgin; the default retries (backoff
      # from 1 s) deliver the updates that arrive before it listens.
      on_full: drop_oldest
