services:
  tgin:
    build: ../../
    # Shutdown drains for up to about 20 s; Docker's default 10 s cuts it short.
    stop_grace_period: 30s
    # No published ports: the bots reach the data plane (8080) on the compose
    # network, and the admin plane stays on the container's loopback.
    # The directory, not the file: a single-file bind mount keeps the old
    # inode, so an edit saved by rename would never reach the container.
    volumes:
      - ./config:/etc/tgin:ro
    environment:
      - TOKEN=${TOKEN:?set TOKEN}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org}
      - TGIN_ADMIN_TOKEN=${TGIN_ADMIN_TOKEN:?set TGIN_ADMIN_TOKEN}

  # Every bot's Bot API is tgin's gateway, http://tgin:8080/c/<consumer>, so
  # the bots start once tgin is ready (the image's health check).
  bot1:
    build: .
    depends_on:
      tgin:
        condition: service_healthy
    environment:
      - TOKEN=${TOKEN}
      - TGIN_BASE=http://tgin:8080/c/bot1

  bot2:
    build: .
    command: ["uv", "run", "bot1.py"]
    depends_on:
      tgin:
        condition: service_healthy
    environment:
      - TOKEN=${TOKEN}
      - REPLY=hello from bot 2
      - TGIN_BASE=http://tgin:8080/c/bot2

  bot3:
    build: .
    command: ["uv", "run", "bot3.py"]
    depends_on:
      tgin:
        condition: service_healthy
    environment:
      - TOKEN=${TOKEN}
      - TGIN_BASE=http://tgin:8080/c/bot3
      - PORT=3001
