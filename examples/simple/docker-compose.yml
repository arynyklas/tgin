services:
  tgin:
    build: ../../
    container_name: tgin_server
    # Shutdown drains for up to about 21 s; Docker's default 10 s cuts it short.
    stop_grace_period: 30s
    ports:
      # Loopback only: the management API must not be reachable from the network.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./tgin.ron:/etc/tgin/config.ron
    environment:
      - TOKEN=${TOKEN}
      - WH_ENDPOINT=http://bot_3:3001/bot
      - TGIN_AUTH_TOKEN=${TGIN_AUTH_TOKEN:?set TGIN_AUTH_TOKEN}

  bot_1:
    build: .
    depends_on:
      - tgin
    environment:
      - TOKEN=${TOKEN}
      - TGIN_ENDPOINT=http://tgin:3000/bot1/getUpdates

  bot_2:
    build: .
    depends_on:
      - tgin
    environment:
      - TOKEN=${TOKEN}
      - TGIN_ENDPOINT=http://tgin:3000/bot2/getUpdates
    volumes:
      - ./bot2.py:/app/main.py

  bot_3:
    build: .
    depends_on:
      - tgin
    environment:
      - TOKEN=${TOKEN}
      - PORT=3001

    volumes:
      - ./bot3.py:/app/main.py
