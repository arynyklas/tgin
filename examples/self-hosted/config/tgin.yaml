# yaml-language-server: $schema=../../../schema/tgin.v1.schema.json
#
# One bot whose Bot API is a self-hosted telegram-bot-api server in local
# mode (compose.yaml), long-polled by tgin, and one downstream instance that
# polls tgin (pull). compose.yaml mounts this directory as /etc/tgin and sets
# BOT_TOKEN and TGIN_ADMIN_TOKEN.
version: 1

# The data plane: the gateway, which the bot uses as its Bot API.
server:
  listen: ["0.0.0.0:8080"]

# The admin plane (health, status, metrics) stays on its default loopback
# listener, 127.0.0.1:9090, inside the container. The image's HEALTHCHECK
# needs no token; the other admin endpoints need TGIN_ADMIN_TOKEN.
admin:
  token: ${env:TGIN_ADMIN_TOKEN}

upstreams:
  # The server on the private `upstream` network. Plain HTTP: the server has
  # no TLS, and this traffic never leaves the compose network (tgin warns
  # about plain http to a host that is not loopback all the same).
  tba:
    kind: local
    url: http://telegram-bot-api:8081
    # The server runs with --local: getFile answers absolute paths on its
    # disk, and it would read a `file:` upload from its own disk.
    local_mode: true
    # The server's --files-dir, mounted read-only in tgin at the same path
    # (compose.yaml). tgin serves the bot's files from it on
    # /file/bot<token>/…, and turns getFile's absolute paths into paths
    # under the bot's directory.
    files:
      dir: /var/lib/telegram-bot-api/files
    # response_timeout defaults to 10m for a local server, which may forward
    # a large upload to Telegram before it answers.

bots:
  - name: main
    token: ${env:BOT_TOKEN}
    upstream: tba
    # allow_local_files is off: tgin refuses a `file:` reference from the
    # bot, so the bot cannot make the server upload its own files.
    # Long poll: the server is reached only from tgin, and nothing reaches
    # tgin from outside.
    ingress:
      long_poll: {}
    routes:
      - to: [bot]

consumers:
  # The bot polls http://tgin:8080/c/bot.
  bot:
    pull:
      # A stopped bot loses its oldest updates instead of pausing the source.
      on_full: drop_oldest
