# cargo-deny configuration (cargo-deny 0.20). CI runs `cargo deny check` via
# EmbarkStudios/cargo-deny-action; run it locally with the same command.

[graph]
all-features = false

# Advisories: RustSec database. Vulnerability advisories are always errors;
# unmaintained and unsound advisories are errors for every crate in the graph
# (0.20 defaults unsound to the workspace only), and yanked crates are errors
# (0.20 defaults to a warning).
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# Exactly the licenses the current dependency graph needs. Each entry names the
# crates whose license expression cannot be satisfied without it.
allow = [
    # tgin itself (LICENSE), tokio, axum, hyper, tower, tracing and ~40 more
    "MIT",
    # sync_wrapper; aws-lc-sys (AND expression); ryu picks it over BSL-1.0
    "Apache-2.0",
    # subtle, matchit (MIT AND BSD-3-Clause), aws-lc-sys, encoding_rs (via serde-saphyr)
    "BSD-3-Clause",
    # rustls-webpki, untrusted, aws-lc-rs, aws-lc-sys, inotify, inotify-sys
    "ISC",
    # icu_* / zerovec / yoke / zerofrom / tinystr / litemap / writeable /
    # potential_utf (via url -> idna), unicode-ident
    "Unicode-3.0",
    # webpki-root-certs (via rustls-platform-verifier)
    "CDLA-Permissive-2.0",
    # notify (via notify-debouncer-full)
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
# The TLS stack is rustls + aws-lc-rs only. ring 0.17 appears in Cargo.lock as
# an inactive optional dependency of quinn-proto / rustls-webpki
# (rust-lang/cargo#10801) but is not part of the resolved graph checked here.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
