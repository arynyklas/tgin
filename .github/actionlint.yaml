# release.yml is generated by dist. These shellcheck findings are in its
# template scripts (an intentionally unquoted optional `--prerelease` flag and
# quoting/grouping style) and are left as generated.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:.+'
      - 'shellcheck reported issue in this script: SC2129:.+'
