version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/tests/performance/benchmark"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories:
      - "/"
      - "/tests/performance/benchmark"
      - "/tests/performance/bot"
      - "/examples/simple"
      - "/tests/e2e/fake-telegram"
      - "/tests/e2e/bots/python"
      - "/tests/e2e/bots/node"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directories:
      - "/examples/simple"
      - "/tests/performance/diagram"
      - "/tests/e2e/bots/python"
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: "/tests/performance/bot"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/tests/e2e/bots/node"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
